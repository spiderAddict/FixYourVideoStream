name: Build And Push Docker Image

on:
  push:
    branches: ['main']

# Lecture seule par défaut : les droits d'écriture sont accordés job par job
permissions:
  contents: read

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:

  tests:
    uses: ./.github/workflows/tests.yml

  release:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: write        # création du tag et de la release GitHub
      issues: write          # commentaires de semantic-release
      pull-requests: write   # commentaires de semantic-release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historique et tags complets pour calculer la version
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes -p semantic-release@25 -p conventional-changelog-conventionalcommits@10 semantic-release
      # semantic-release pose le tag sur HEAD : pas de tag, pas de release
      - name: Get released version
        id: version
        run: |
          TAG=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Version publiée : '${TAG}'"

  docker:
    runs-on: ubuntu-latest
    needs: release
    # Pas d'image si aucun commit ne justifie une nouvelle version
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest
      - name: Docker Build
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          context: .
          push: true
          build-args: |
            APP_VERSION=v${{ needs.release.outputs.version }}
